site_name: pyspecification
site_description: Business rules as composable, typed predicates, compilable from JSON and described by JSON Schema.
site_url: https://aaltatan.github.io/pyspecification/
repo_url: https://github.com/aaltatan/pyspecification
repo_name: aaltatan/pyspecification
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

theme:
  name: material
  icon:
    logo: material/scale-balance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Predicates: guide/predicates.md
      - Object rules: guide/object-rules.md
      - Subscriptable rules: guide/subscriptable-rules.md
      - Registries: guide/registries.md
      - Why a rule failed: guide/failures.md
      - Arguments and processing: guide/arguments.md
      - Compiling rules from JSON: guide/compiling.md
      - JSON Schema: guide/json-schema.md
  - Integrations:
      - integrations/index.md
      - SQLAlchemy: integrations/sqlalchemy.md
      - Django: integrations/django.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Exceptions: reference/exceptions.md
      - Upgrading: reference/upgrading.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyspecification
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyspecification/
