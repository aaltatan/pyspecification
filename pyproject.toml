[project]
name = "pyspecification"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "aaltatan", email = "a.altatan@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13.4"]

[project.scripts]
pyspecification = "pyspecification:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
